backend:
  name: github
  repo: lukegap/the-art-garden
  branch: cloudflare-production
  base_url: https://decap-auth.lukepounder1997.workers.dev
  auth_endpoint: auth

media_folder: "uploads"
public_folder: "/uploads"

publish_mode: simple

collections:
  - name: "events"
    label: "Events"
    files:
      - name: "events"
        label: "Events"
        file: "events.json"
        format: "json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
                required: false

              - label: "Date"
                name: "date"
                widget: "string"

              - label: "Time"
                name: "time"
                widget: "string"
                required: false

              - label: "Location"
                name: "location"
                widget: "string"
                required: false

              - label: "Price"
                name: "price"
                widget: "string"
                required: false

              - label: "Event Image"
                name: "image"
                widget: "image"
                required: false

              - label: "Image Position"
                name: "position"
                widget: "select"
                required: false
                options:
                  - "left top"
                  - "center top"
                  - "right top"
                  - "left center"
                  - "center center"
                  - "right center"
                  - "left bottom"
                  - "center bottom"
                  - "right bottom"
                default: "center center"

              - label: "Booking URL"
                name: "bookingUrl"
                widget: "string"
                required: false

              - label: "Active"
                name: "active"
                widget: "boolean"
                default: true

  - name: "site-settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "Site Settings"
        file: "site-settings.json"
        format: "json"
        fields:
          - label: "Phone"
            name: "phone"
            widget: "string"
            required: false

          - label: "Email"
            name: "email"
            widget: "string"
            required: false

          - label: "WhatsApp"
            name: "whatsapp"
            widget: "string"
            required: false

          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false

          - label: "Facebook"
            name: "facebook"
            widget: "string"
            required: false

          - label: "TikTok"
            name: "tiktok"
            widget: "string"
            required: false

          - label: "Book Now URL"
            name: "bookNowUrl"
            widget: "string"
            required: false

          - label: "Private Events URL"
            name: "privateEventsUrl"
            widget: "string"
            required: false

          - label: "Corporate URL"
            name: "corporateUrl"
            widget: "string"
            required: false

          - label: "Academy URL"
            name: "academyUrl"
            widget: "string"
            required: false

          - label: "Studio URL"
            name: "studioUrl"
            widget: "string"
            required: false

          - label: "Collaborate URL"
            name: "collaborateUrl"
            widget: "string"
            required: false

  - name: "photos"
    label: "Photos & Cropping"
    files:
      - name: "images"
        label: "Photos & Cropping"
        file: "site-images.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
              - label: "Position"
                name: "position"
                widget: "string"
                default: "center center"

          - label: "Experience — People"
            name: "experience_people"
            widget: "object"
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
              - label: "Position"
                name: "position"
                widget: "string"
                default: "center center"

          - label: "Experience — Space"
            name: "experience_space"
            widget: "object"
            fields:
